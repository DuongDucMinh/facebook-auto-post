<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealPost AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo {
      width: 28px; height: 28px;
      background: #10b981;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .title { font-weight: 700; font-size: 14px; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .status-label { font-size: 12px; color: #94a3b8; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected { background: #10b981; }
    .status-text { font-size: 12px; font-weight: 500; }
    .btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #059669; }
    .btn.secondary {
      background: #1e293b;
      color: #94a3b8;
      margin-top: 6px;
    }
    .queue-info { font-size: 11px; color: #64748b; text-align: center; margin-top: 8px; }
    .error { color: #f87171; font-size: 11px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div class="title">RealPost AI Bridge</div>
  </div>

  <div class="status-row">
    <div>
      <div class="status-label">Web App</div>
      <div class="status-text" id="webapp-status">Chưa kết nối</div>
    </div>
    <div class="status-dot" id="webapp-dot"></div>
  </div>

  <div class="status-row">
    <div>
      <div class="status-label">Bài đang chờ đăng</div>
      <div class="status-text" id="queue-count">--</div>
    </div>
    <div style="font-size: 18px;">📋</div>
  </div>

  <div class="status-row">
    <div>
      <div class="status-label">Trạng thái</div>
      <div class="status-text" id="poll-status">Chờ lệnh...</div>
    </div>
  </div>

  <button class="btn" id="open-app">Mở RealPost AI →</button>
  <button class="btn secondary" id="force-poll">Kiểm tra ngay</button>
  <div class="queue-info" id="last-poll">Chưa kiểm tra lần nào</div>
  <div class="error" id="error-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
